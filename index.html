<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="weather-background">
        <img class="weather-gif" src="./assets/clear.gif" alt="">
    </div>
    <div class="weather-card">
        <div class="search-box">
            <input type="text" class="search-input" placeholder="Enter city name" autocomplete="off">
            <button class="search-button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <p class="error-message"></p>
        <div class="weather">
            <img class="weather-icon" src="./assets/clear-day.png" alt="Weather icon">
            <h1 class="temperature">--°C</h1>
            <h2 class="city-name">Search a city</h2>
            <p class="weather-condition">--</p>
            <div class="weather-details">
                <div class="detail">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <span class="humidity">--%</span>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="detail">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <span class="wind-speed">-- km/h</span>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
